[project]
name = "invoice-discrepancy-agent"
version = "0.1.0"
description = "CrewAI crew that compares an invoice against purchase terms and writes a discrepancy report"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai]==1.15.22",
    "crewai-tools[mcp]==1.15.22",
    "llama-index-core>=0.14",
    "llama-index-readers-file>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discrepancy-report = "invoice_discrepancy_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_discrepancy_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
